[versions]
agp = "8.5.1"
kotlin = "2.0.0"
coreKtx = "1.12.0"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
lifecycleRuntimeKtx = "2.7.0"
activityCompose = "1.8.0"
composeBom = "2024.02.00"
navigationCompose = "2.7.6"
firebaseBom = "32.7.0"
coilCompose = "2.5.0"
accompanistPermissions = "0.32.0"
lifecycleViewmodelCompose = "2.7.0"
appcompat = "1.7.1"
material = "1.13.0"
activity = "1.12.4"
constraintlayout = "2.2.1"
